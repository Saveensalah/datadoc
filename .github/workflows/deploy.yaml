name: Deploy Frontend to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: action/setup-node@v4
        with:
          node-version:'20'
          cache: 'npm'
      - name: Install dependencies
      run: npm ci

      - name: Build Next.js project
        run: npm run build

      - name: Deploy files to Azure VM over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Deploying the generated static/export build output to Nginx
          source: "."
          target: "/var/www/html"
          strip_components: 1